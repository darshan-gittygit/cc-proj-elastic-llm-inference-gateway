# Elastic LLM Inference Gateway - runtime configuration.
# Switching scheduler / router / prewarm = edit this file, then `POST /admin/reload`.
# No code change is needed. (Replica container settings apply to NEW replicas.)

# ---- scheduling ------------------------------------------------------------
scheduler: spf_aging        # fcfs | spf_aging
aging_alpha: 5.0            # spf_aging: priority = prompt_tokens - alpha * wait_seconds (lower = served first)

# ---- routing ---------------------------------------------------------------
router: least_busy          # round_robin | least_busy | session_affinity

# ---- autoscaling -----------------------------------------------------------
min_replicas: 1
max_replicas: 3             # keep max_replicas * replica_cpus <= host cores
scale_up_threshold: 4.0     # signal = (queued + in_flight) / ready_replicas
scale_down_threshold: 1.0
scale_up_after_s: 5.0       # signal must stay above threshold this long
scale_down_cooldown_s: 30.0

# ---- pre-warming -----------------------------------------------------------
prewarm: warm_pool          # none | warm_pool
warm_pool_size: 1
prewarm_trigger_ratio: 0.7

# ---- fault tolerance -------------------------------------------------------
health_interval_s: 1.5
health_fail_limit: 3
max_retries: 2

# ---- replica containers (passed to Docker Engine API) ----------------------
replica_image: ghcr.io/ggml-org/llama.cpp:server
replica_cpus: 1.0
replica_memory: 1g
slots_per_replica: 2
ctx_per_slot: 2048
models_dir: ./models
model_file: qwen2.5-0.5b-instruct-q4_k_m.gguf
docker_network: llmgw-net
container_prefix: llmgw-replica-
default_temperature: 0.0
